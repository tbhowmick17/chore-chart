name: Deploy Chore Scheduler

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: chore-chart

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set bucket name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET_NAME=chore-scheduler-${ACCOUNT_ID}-${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Create S3 bucket if not exists
        run: |
          if aws s3api head-bucket --bucket "${{ env.BUCKET_NAME }}" 2>/dev/null; then
            echo "Bucket exists"
          else
            aws s3api create-bucket \
              --bucket "${{ env.BUCKET_NAME }}" \
              --region ${{ env.AWS_REGION }}
            echo "Bucket created"
          fi

      - name: Package and upload Lambda
        run: |
          cd lambda
          zip -r handler.zip handler.py
          cd ..
          aws s3 cp lambda/handler.zip s3://${{ env.BUCKET_NAME }}/lambda/handler.zip
          aws s3 cp chores.json s3://${{ env.BUCKET_NAME }}/chores.json
          aws s3 cp email_template.txt s3://${{ env.BUCKET_NAME }}/email_template.txt
          echo "All files uploaded"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides \
              SubscriberEmail=${{ secrets.SUBSCRIBER_EMAIL }} \
              RecipientEmails=${{ secrets.RECIPIENT_EMAILS }} \
              ScheduleExpression="rate(1 day)" \
              ScheduleName="Daily Chore Scheduler" \
            --region ${{ env.AWS_REGION }}

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs" \
            --output table \
            --region ${{ env.AWS_REGION }}

      - name: Test invoke Lambda
        run: |
          aws lambda invoke \
            --function-name ChoreSchedulerFunction \
            --region ${{ env.AWS_REGION }} \
            --log-type Tail \
            response.json
          cat response.json