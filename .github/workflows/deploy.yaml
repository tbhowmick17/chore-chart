name: deploy Chore Chart

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  AWS_REGION: us-east-1
  STACK_NAME: chore-chart
  S3_KEY: lambda/handler.zip

jobs:
  deploy:
    name: Package and deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip Lambda Functions
        run: |
          cd lambda
          zip -r handler.zip handler.py
          echo "Lambda package size: $(du -sh handler.zip | cut -f1)"

      - name: Ensure S3 bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="serverless-scheduler-${ACCOUNT_ID}-${{ env.AWS_REGION }}"
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket already exists: $BUCKET_NAME"
          else
            echo "Creating bucket: $BUCKET_NAME"
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region ${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
          fi

      - name: Upload files to S3
        run: |
          aws s3 cp lambda/handler.zip \
            s3://${{ env.BUCKET_NAME }}/${{ env.S3_KEY }} \
            --region ${{ env.AWS_REGION }}
          echo "Uploaded Lambda package"

          aws s3 cp chores.json \
            s3://${{ env.BUCKET_NAME }}/chores.json \
            --region ${{ env.AWS_REGION }}
          echo "Uploaded chores.json"

          aws s3 cp email_template.txt \
            s3://${{ env.BUCKET_NAME }}/email_template.txt \
            --region ${{ env.AWS_REGION }}
          echo "Uploaded email_template.txt"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name chore-chart \
            --parameter-overrides \
              SubscriberEmail=${{ secrets.SUBSCRIBER_EMAIL }} \
            --region ${{ env.AWS_REGION }}
          
      - name: Show stack outputs
        run: |
          echo "===== Stack Outputs ====="
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs" \
            --output table \
            --region ${{ env.AWS_REGION }}
          
      - name: Test invoke Lambda
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "Invoking: $FUNCTION_NAME"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --region ${{ env.AWS_REGION }} \
            --log-type Tail \
            response.json

          echo "===== Lambda Response ====="
          cat response.json