AWSTemplateFormatVersion: "2010-09-09"
Description: Chore Scheduler - minimal test

Parameters:
  SubscriberEmail:
    Type: String

Resources:

  LambdaCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "chore-scheduler-${AWS::AccountId}-${AWS::Region}"

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ChoreSchedulerTopic

  RecipientSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref SubscriberEmail

Outputs:
  BucketName:
    Value: !Ref LambdaCodeBucket
  TopicArn:
    Value: !Ref NotificationTopic