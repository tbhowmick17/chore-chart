AWSTemplateFormatVersion: "2010-09-09"
Description: Chore Scheduler - SNS + Lambda

Parameters:
  SubscriberEmail:
    Type: String

  RecipientEmails:
    Type: String

  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"

  ScheduleName:
    Type: String
    Default: "Daily Chore Scheduler"

  BucketName:
    Type: String
    Description: Pre-existing S3 bucket containing Lambda code and chores list.

Resources:

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ChoreSchedulerTopic

  RecipientSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref SubscriberEmail

  SchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ChoreSchedulerFunction
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Timeout: 30
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref NotificationTopic
          SCHEDULE_NAME: !Ref ScheduleName
          RECIPIENT_EMAILS: !Ref RecipientEmails
          S3_BUCKET: !Ref BucketName
          CHORES_KEY: "chores.json"
          TEMPLATE_KEY: "email_template.txt"
      Code:
        S3Bucket: !Ref BucketName
        S3Key: lambda/handler.zip

  SchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ChoreSchedulerRule
      Description: !Sub "Triggers the chore scheduler: ${ScheduleExpression}"
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: ChoreSchedulerTarget
          Arn: !GetAtt SchedulerFunction.Arn

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SchedulerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchedulerRule.Arn

Outputs:
  LambdaFunctionName:
    Value: !Ref SchedulerFunction
  SNSTopicArn:
    Value: !Ref NotificationTopic
  EventBridgeRuleName:
    Value: !Ref SchedulerRule
